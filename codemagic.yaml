workflows:
  release-to-store:
    name: NOOR Release to App Store
    max_build_duration: 10
    instance_type: mac_mini_m2

    environment:
      groups:
        - apple_credentials

    scripts:
      - name: Release approved version
        script: |
          pip3 install PyJWT cryptography -q

          python3 << 'EOF'
          import jwt, time, urllib.request, json, sys

          key = open('/tmp/asc.p8','w')
          import os
          raw = os.environ['ASC_PRIVATE_KEY']
          key.write(raw)
          key.close()

          token = jwt.encode(
            {'iss': os.environ['ASC_ISSUER_ID'], 'iat': int(time.time()), 'exp': int(time.time())+300, 'aud': 'appstoreconnect-v1'},
            open('/tmp/asc.p8').read(),
            algorithm='ES256',
            headers={'kid': os.environ['ASC_KEY_ID']}
          )

          headers = {'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'}

          def api(method, path, body=None):
            url = f'https://api.appstoreconnect.apple.com{path}'
            data = json.dumps(body).encode() if body else None
            req = urllib.request.Request(url, data=data, headers=headers, method=method)
            try:
              with urllib.request.urlopen(req) as r:
                return json.loads(r.read())
            except urllib.error.HTTPError as e:
              print(e.read().decode()); sys.exit(1)

          apps = api('GET', '/v1/apps?filter[bundleId]=ch.architectdna.noor')
          print('apps:', json.dumps(apps.get('data',[{}])[0].get('attributes',{})))
          app_id = apps['data'][0]['id']
          print(f"App ID: {app_id}")

          versions = api('GET', f'/v1/apps/{app_id}/appStoreVersions')
          for v in versions['data']:
            state = v['attributes']['appVersionState']
            vid = v['id']
            print(f"Version {v['attributes']['versionString']}: {state}")
            if state == 'PENDING_DEVELOPER_RELEASE':
              print(f"Releasing {vid}...")
              api('POST', f'/v1/appStoreVersionReleaseRequests',
                {'data': {'type': 'appStoreVersionReleaseRequests', 'relationships': {'appStoreVersion': {'data': {'type': 'appStoreVersions', 'id': vid}}}}})
              print("Released!")
          EOF

  ios-release:
    name: NOOR iOS Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Architect-DNA CI

    environment:
      xcode: 26
      node: 24
      vars:
        BUNDLE_ID: ch.architectdna.noor
        TEAM_ID: V28MG47TZC
      groups:
        - signing

    scripts:
      - name: Install dependencies
        script: npm ci

      - name: Sync Capacitor
        script: npx cap sync ios

      - name: Install signing assets
        script: |
          # Keychain
          security create-keychain -p cmpass build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p cmpass build.keychain
          security set-keychain-settings -t 7200 -u build.keychain

          # P12 cert
          echo "$DIST_P12_BASE64" | base64 --decode > /tmp/dist.p12
          security import /tmp/dist.p12 -k build.keychain -P cmpass -T /usr/bin/codesign -T /usr/bin/xcodebuild
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k cmpass build.keychain

          # Fetch & install provisioning profile via Codemagic CLI
          pip3 install codemagic-cli-tools -q
          app-store-connect fetch-signing-files \
            ch.architectdna.noor \
            --type IOS_APP_STORE \
            --create \
            --certificate-key /tmp/dist.p12 \
            --private-key $ASC_PRIVATE_KEY \
            --key-id $ASC_KEY_ID \
            --issuer-id $ASC_ISSUER_ID

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project ios/App/App.xcodeproj \
            -scheme App

      - name: Build IPA
        script: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -archivePath build/App.xcarchive \
            archive \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="NOOR Distribution" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=$TEAM_ID

          xcodebuild \
            -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/

    artifacts:
      - build/*.ipa

    publishing:
      app_store_connect:
        auth: integration
        api_key: Architect-DNA CI
        submit_to_testflight: true
