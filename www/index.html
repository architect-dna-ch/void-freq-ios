<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>NOOR</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0c10;--bg2:#13161f;--bg3:#1a1e2a;
  --text:#f4f1e8;--text2:rgba(244,241,232,.55);--text3:rgba(244,241,232,.28);
  --gold:#c9a84c;--gold2:#e8c96a;--teal:#00c9a7;
  --border:rgba(255,255,255,.07);--border2:rgba(255,255,255,.14);
  --font:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;
  --safe-top:env(safe-area-inset-top,20px);
  --safe-bot:env(safe-area-inset-bottom,20px);
}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--font);-webkit-font-smoothing:antialiased}

/* ── SHELL ── */
#shell{display:flex;flex-direction:column;height:100%;padding-top:var(--safe-top)}
#topbar{padding:12px 20px 8px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.app-name{font-size:20px;font-weight:900;letter-spacing:-.04em;color:var(--gold)}
.app-name span{color:var(--text3);font-weight:400;font-size:13px;margin-left:6px;letter-spacing:.08em}
.prayer-pill{font-size:11px;font-weight:700;color:var(--text3);background:var(--bg2);border:1px solid var(--border);border-radius:20px;padding:5px 12px}

/* ── TABS ── */
#content{flex:1;overflow:hidden;position:relative}
.tab{position:absolute;inset:0;overflow-y:auto;padding:16px 16px calc(var(--safe-bot) + 72px);display:none}
.tab.active{display:block}

/* ── BOTTOM NAV ── */
#nav{position:absolute;bottom:0;left:0;right:0;padding-bottom:var(--safe-bot);background:rgba(10,12,16,.95);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;flex-shrink:0}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 0;border:none;background:none;color:var(--text3);font-size:10px;font-weight:700;letter-spacing:.06em;cursor:pointer;font-family:var(--font);transition:color .15s}
.nav-btn .icon{font-size:22px;line-height:1}
.nav-btn.active{color:var(--gold)}

/* ── CARDS ── */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:18px;padding:20px;margin-bottom:12px}
.card-title{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--text3);margin-bottom:14px}
.card-title .dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:7px;vertical-align:middle}

/* ── DHIKR TAB ── */
.dhikr-main{text-align:center;padding:20px 0 0}
.dhikr-arabic{font-size:36px;font-weight:700;color:var(--text);line-height:1.4;margin-bottom:6px;letter-spacing:.02em}
.dhikr-transliteration{font-size:13px;color:var(--text3);margin-bottom:4px}
.dhikr-meaning{font-size:12px;color:var(--text3);font-style:italic;margin-bottom:28px}
.dhikr-counter-ring{position:relative;width:200px;height:200px;margin:0 auto 24px}
.dhikr-counter-ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.dhikr-ring-bg{fill:none;stroke:var(--border2);stroke-width:8}
.dhikr-ring-fill{fill:none;stroke:var(--gold);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset .25s ease}
.dhikr-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dhikr-count{font-size:52px;font-weight:900;letter-spacing:-.05em;color:var(--text);line-height:1}
.dhikr-goal-label{font-size:12px;color:var(--text3);margin-top:2px}
.dhikr-tap{width:100%;padding:18px;background:var(--gold);color:#0a0c10;border:none;border-radius:16px;font-size:18px;font-weight:900;cursor:pointer;font-family:var(--font);letter-spacing:-.01em;transition:filter .1s,transform .1s;active-transform:scale(.97)}
.dhikr-tap:active{filter:brightness(.9);transform:scale(.97)}
.dhikr-switcher{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.dhikr-switcher::-webkit-scrollbar{display:none}
.dsw-btn{flex-shrink:0;padding:7px 14px;border-radius:20px;border:1px solid var(--border2);background:none;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font);transition:all .15s;white-space:nowrap}
.dsw-btn.active{background:var(--gold);color:#0a0c10;border-color:var(--gold)}

/* ── DUA TAB ── */
.dua-search{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:10px 14px;font-size:15px;color:var(--text);outline:none;font-family:var(--font);margin-bottom:14px}
.dua-search::placeholder{color:var(--text3)}
.dua-card{background:var(--bg2);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:10px;cursor:pointer;transition:border-color .2s}
.dua-card:active{border-color:var(--border2);background:var(--bg3)}
.dua-cat{font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.dua-arabic{font-size:20px;color:var(--text);line-height:1.7;text-align:right;margin-bottom:10px;direction:rtl}
.dua-latin{font-size:12px;color:var(--text2);line-height:1.6;margin-bottom:6px;font-style:italic}
.dua-meaning{font-size:12px;color:var(--text3);line-height:1.6}
.dua-expand{display:none}
.dua-card.open .dua-expand{display:block}
.dua-card.open{border-color:rgba(201,168,76,.3);background:rgba(201,168,76,.04)}

/* ── REFLECT TAB ── */
.reflect-input{width:100%;min-height:120px;background:var(--bg2);border:1px solid var(--border2);border-radius:14px;padding:14px;font-size:15px;color:var(--text);outline:none;font-family:var(--font);resize:none;line-height:1.6}
.reflect-input::placeholder{color:var(--text3)}
.reflect-btn{width:100%;padding:15px;background:var(--gold);color:#0a0c10;border:none;border-radius:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:var(--font);margin-top:10px;transition:filter .15s}
.reflect-btn:active{filter:brightness(.9)}
.reflect-btn:disabled{opacity:.45;cursor:default}
.ai-response{background:rgba(201,168,76,.06);border:1px solid rgba(201,168,76,.2);border-radius:14px;padding:18px;margin-top:14px}
.ai-response-text{font-size:15px;color:var(--text2);line-height:1.75}
.ai-ayah{font-size:18px;color:var(--text);text-align:right;direction:rtl;margin-top:14px;line-height:1.7;border-top:1px solid var(--border);padding-top:14px}
.ai-ayah-ref{font-size:11px;color:var(--gold);margin-top:6px;text-align:right}
.typing-dot{display:inline-block;width:6px;height:6px;background:var(--gold);border-radius:50%;animation:blink 1s infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.2}40%{opacity:1}}

/* ── WINS TAB ── */
.wins-input-row{display:flex;gap:8px;margin-bottom:14px}
.wins-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;font-size:15px;color:var(--text);outline:none;font-family:var(--font)}
.wins-input::placeholder{color:var(--text3)}
.wins-add-btn{background:var(--gold);color:#0a0c10;border:none;border-radius:12px;padding:0 18px;font-size:18px;font-weight:900;cursor:pointer}
.win-item{display:flex;align-items:flex-start;gap:10px;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;margin-bottom:8px;animation:slideIn .2s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.win-star{font-size:18px;flex-shrink:0}
.win-text{font-size:14px;color:var(--text2);line-height:1.5;flex:1}
.win-del{background:none;border:none;color:var(--text3);font-size:16px;cursor:pointer;padding:0 4px;flex-shrink:0}
.streak-bar{display:flex;gap:5px;margin-bottom:4px}
.streak-day{flex:1;height:6px;border-radius:3px;background:var(--border)}
.streak-day.done{background:var(--gold)}
.streak-label{font-size:11px;color:var(--text3);margin-bottom:16px}

/* ── PRAYER TIMES ── */
.prayer-row{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--border)}
.prayer-row:last-child{border-bottom:none}
.prayer-name{font-size:14px;font-weight:700;color:var(--text)}
.prayer-time{font-size:14px;color:var(--text2)}
.prayer-row.next .prayer-name{color:var(--gold)}
.prayer-row.next .prayer-time{color:var(--gold)}
.prayer-row.next{background:rgba(201,168,76,.05);margin:0 -20px;padding:12px 20px;border-radius:10px}

/* ── PAYWALL ── */
#paywall{position:fixed;inset:0;z-index:500;background:rgba(10,12,16,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;display:none}
#paywall.show{display:flex}
.pw-icon{font-size:56px;margin-bottom:20px}
.pw-title{font-size:28px;font-weight:900;letter-spacing:-.04em;margin-bottom:10px}
.pw-title span{color:var(--gold)}
.pw-sub{font-size:15px;color:var(--text2);line-height:1.7;max-width:300px;margin-bottom:32px}
.pw-price{font-size:36px;font-weight:900;color:var(--gold);margin-bottom:4px}
.pw-price-sub{font-size:13px;color:var(--text3);margin-bottom:28px}
.pw-btn{width:100%;max-width:320px;padding:18px;background:var(--gold);color:#0a0c10;border:none;border-radius:16px;font-size:16px;font-weight:900;cursor:pointer;font-family:var(--font);margin-bottom:12px}
.pw-restore{background:none;border:none;color:var(--text3);font-size:13px;cursor:pointer;font-family:var(--font)}
.pw-close{position:absolute;top:calc(var(--safe-top) + 12px);right:20px;background:var(--bg2);border:1px solid var(--border);color:var(--text2);font-size:16px;border-radius:50%;width:32px;height:32px;cursor:pointer;display:flex;align-items:center;justify-content:center}
</style>
</head>
<body>

<div id="shell">
  <div id="topbar">
    <div class="app-name">نور NOOR</div>
    <div class="prayer-pill" id="next-prayer-pill">loading…</div>
  </div>

  <div id="content">

    <!-- ── DHIKR ── -->
    <div class="tab active" id="tab-dhikr">
      <div class="dhikr-main">
        <div class="dhikr-arabic" id="d-arabic"></div>
        <div class="dhikr-transliteration" id="d-latin"></div>
        <div class="dhikr-meaning" id="d-meaning"></div>
        <div class="dhikr-counter-ring">
          <svg viewBox="0 0 200 200"><circle class="dhikr-ring-bg" cx="100" cy="100" r="88"/><circle class="dhikr-ring-fill" id="ring-fill" cx="100" cy="100" r="88" stroke-dasharray="553" stroke-dashoffset="553"/></svg>
          <div class="dhikr-num">
            <div class="dhikr-count" id="d-count">0</div>
            <div class="dhikr-goal-label" id="d-goal-label">of 33</div>
          </div>
        </div>
        <button class="dhikr-tap" id="dhikr-tap-btn" onclick="tapDhikr()">Tap</button>
        <div class="dhikr-switcher" id="dhikr-switcher"></div>
      </div>
    </div>

    <!-- ── DUA ── -->
    <div class="tab" id="tab-dua">
      <input class="dua-search" id="dua-search" placeholder="🔍  Search duas…" oninput="filterDuas()">
      <div id="dua-list"></div>
    </div>

    <!-- ── REFLECT (Premium) ── -->
    <div class="tab" id="tab-reflect">
      <div class="card">
        <div class="card-title"><span class="dot" style="background:var(--gold)"></span>Evening Reflection</div>
        <textarea class="reflect-input" id="reflect-input" placeholder="How was your day? What's on your mind…" rows="5"></textarea>
        <button class="reflect-btn" id="reflect-btn" onclick="doReflect()">Get Reflection ✦</button>
      </div>
      <div id="reflect-result"></div>
      <div style="text-align:center;margin-top:8px;font-size:11px;color:var(--text3)">Powered by Groq · stays on device</div>
    </div>

    <!-- ── WINS ── -->
    <div class="tab" id="tab-wins">
      <div class="card">
        <div class="streak-bar" id="streak-bar"></div>
        <div class="streak-label" id="streak-label"></div>
        <div class="card-title"><span class="dot" style="background:var(--gold2)"></span>Today's Wins</div>
        <div class="wins-input-row">
          <input class="wins-input" id="wins-input" placeholder="One thing you did well…" maxlength="100" onkeydown="if(event.key==='Enter')addWin()">
          <button class="wins-add-btn" onclick="addWin()">+</button>
        </div>
        <div id="wins-list"></div>
      </div>

      <div class="card">
        <div class="card-title"><span class="dot" style="background:var(--teal)"></span>Prayer Times · Bern</div>
        <div id="prayer-list"></div>
      </div>
    </div>

  </div>

  <div id="nav">
    <button class="nav-btn active" onclick="switchTab('dhikr',this)"><div class="icon">📿</div>Dhikr</button>
    <button class="nav-btn" onclick="switchTab('dua',this)"><div class="icon">📖</div>Dua</button>
    <button class="nav-btn" onclick="switchTab('reflect',this)"><div class="icon">✦</div>Reflect</button>
    <button class="nav-btn" onclick="switchTab('wins',this)"><div class="icon">⭐</div>Wins</button>
  </div>
</div>

<!-- PAYWALL -->
<div id="paywall">
  <button class="pw-close" onclick="closePaywall()">✕</button>
  <div class="pw-icon">✦</div>
  <div class="pw-title">AI <span>Reflection</span></div>
  <div class="pw-sub">Evening reflection powered by AI. Get a personalised response + a Quran ayah for your day. Once. Forever.</div>
  <div class="pw-price">$4.99</div>
  <div class="pw-price-sub">one-time purchase · no subscription ever</div>
  <button class="pw-btn" id="pw-buy-btn" onclick="unlockPremium()">Unlock — $4.99</button>
  <button class="pw-restore" onclick="restorePurchase()">Restore Purchase</button>
</div>

<script>
// ── DATA ──
const TODAY = new Date().toISOString().slice(0,10);
const S = k => localStorage.getItem('noor_'+k);
const W = (k,v) => localStorage.setItem('noor_'+k, typeof v==='object'?JSON.stringify(v):v);
const J = k => { try{return JSON.parse(S(k))}catch{return null} };

// ── DHIKRS ──
const DHIKRS = [
  {ar:'سُبْحَانَ اللهِ', lat:'SubhanAllah', meaning:'Glory be to God', goal:33},
  {ar:'الْحَمْدُ للهِ',  lat:'Alhamdulillah', meaning:'All praise is due to God', goal:33},
  {ar:'اللهُ أَكْبَرُ',  lat:'Allahu Akbar', meaning:'God is the Greatest', goal:34},
  {ar:'لَا إِلَهَ إِلَّا اللهُ', lat:'La ilaha illallah', meaning:'There is no god but God', goal:100},
  {ar:'أَسْتَغْفِرُ اللهَ', lat:'Astaghfirullah', meaning:'I seek forgiveness from God', goal:100},
];
let dIdx = parseInt(S('dhikr_idx'))||0;

function renderDhikr(){
  const d = DHIKRS[dIdx];
  const count = parseInt(S('dhikr_count_'+dIdx+'_'+TODAY))||0;
  document.getElementById('d-arabic').textContent = d.ar;
  document.getElementById('d-latin').textContent = d.lat;
  document.getElementById('d-meaning').textContent = d.meaning;
  document.getElementById('d-count').textContent = count;
  document.getElementById('d-goal-label').textContent = 'of ' + d.goal;
  const circ = 2*Math.PI*88;
  const pct = Math.min(count/d.goal,1);
  document.getElementById('ring-fill').style.strokeDashoffset = circ*(1-pct);
  document.getElementById('ring-fill').style.stroke = pct>=1 ? 'var(--teal)' : 'var(--gold)';
  // switcher
  const sw = document.getElementById('dhikr-switcher');
  sw.innerHTML = '';
  DHIKRS.forEach((x,i)=>{
    const b = document.createElement('button');
    b.className = 'dsw-btn'+(i===dIdx?' active':'');
    b.textContent = x.lat;
    b.onclick = ()=>{ dIdx=i; W('dhikr_idx',i); renderDhikr(); };
    sw.appendChild(b);
  });
}

function tapDhikr(){
  const d = DHIKRS[dIdx];
  const key = 'dhikr_count_'+dIdx+'_'+TODAY;
  let count = parseInt(S(key))||0;
  if(count>=d.goal) return;
  count++;
  W(key,count);
  // haptic
  if(navigator.vibrate) navigator.vibrate(30);
  const btn = document.getElementById('dhikr-tap-btn');
  btn.style.transform='scale(.95)';
  setTimeout(()=>btn.style.transform='',100);
  renderDhikr();
}

// ── DUAS ──
const DUAS = [
  {cat:'Morning',ar:'اللَّهُمَّ بِكَ أَصْبَحْنَا وَبِكَ أَمْسَيْنَا وَبِكَ نَحْيَا وَبِكَ نَمُوتُ وَإِلَيْكَ النُّشُورُ',lat:'Allahumma bika asbahna wa bika amsayna...',meaning:'O Allah, by You we enter the morning and by You we enter the evening...'},
  {cat:'Morning',ar:'أَصْبَحْنَا وَأَصْبَحَ الْمُلْكُ للهِ',lat:'Asbahna wa asbahal mulku lillah',meaning:'We have entered the morning and the whole kingdom belongs to Allah.'},
  {cat:'Evening',ar:'اللَّهُمَّ بِكَ أَمْسَيْنَا وَبِكَ أَصْبَحْنَا وَبِكَ نَحْيَا',lat:'Allahumma bika amsayna wa bika asbahna...',meaning:'O Allah, by You we enter the evening and by You we enter the morning...'},
  {cat:'Sleep',ar:'بِاسْمِكَ اللَّهُمَّ أَمُوتُ وَأَحْيَا',lat:"Bismika Allahumma amutu wa ahya",meaning:'In Your name, O Allah, I die and I live.'},
  {cat:'Food',ar:'اللَّهُمَّ بَارِكْ لَنَا فِيمَا رَزَقْتَنَا وَقِنَا عَذَابَ النَّارِ',lat:'Allahumma barik lana fima razaqtana...',meaning:'O Allah, bless us in what You have provided us and protect us from the punishment of the Fire.'},
  {cat:'Travel',ar:'سُبْحَانَ الَّذِي سَخَّرَ لَنَا هَذَا وَمَا كُنَّا لَهُ مُقْرِنِينَ',lat:"Subhana-lladhi sakhkhara lana hadha...",meaning:'Glory be to Him who has made this subservient to us.'},
  {cat:'Anxiety',ar:'حَسْبُنَا اللهُ وَنِعْمَ الْوَكِيلُ',lat:'Hasbunallahu wa ni\'mal wakil',meaning:'Allah is sufficient for us and He is the best Disposer of affairs.'},
  {cat:'Anxiety',ar:'لَا إِلَهَ إِلَّا أَنتَ سُبْحَانَكَ إِنِّي كُنتُ مِنَ الظَّالِمِينَ',lat:'La ilaha illa anta subhanaka inni kuntu minaz-zalimin',meaning:'There is no god but You, Glory be to You, I was indeed of the wrongdoers.'},
  {cat:'Forgiveness',ar:'رَبَّنَا ظَلَمْنَا أَنفُسَنَا وَإِن لَّمْ تَغْفِرْ لَنَا وَتَرْحَمْنَا لَنَكُونَنَّ مِنَ الْخَاسِرِينَ',lat:'Rabbana zalamna anfusana...',meaning:'Our Lord, we have wronged ourselves, and if You do not forgive us and have mercy upon us, we will surely be among the losers.'},
  {cat:'Parents',ar:'رَّبِّ ارْحَمْهُمَا كَمَا رَبَّيَانِي صَغِيرًا',lat:"Rabbi irhamhuma kama rabbayani saghira",meaning:'My Lord, have mercy upon them as they brought me up when I was small.'},
  {cat:'Knowledge',ar:'رَّبِّ زِدْنِي عِلْمًا',lat:'Rabbi zidni ilma',meaning:'My Lord, increase me in knowledge.'},
  {cat:'Guidance',ar:'رَبَّنَا لَا تُزِغْ قُلُوبَنَا بَعْدَ إِذْ هَدَيْتَنَا',lat:'Rabbana la tuzigh qulubana ba\'da idh hadaytana',meaning:'Our Lord, do not let our hearts deviate after You have guided us.'},
];

function renderDuas(filter=''){
  const list = document.getElementById('dua-list');
  const f = filter.toLowerCase();
  const filtered = f ? DUAS.filter(d=>d.cat.toLowerCase().includes(f)||d.lat.toLowerCase().includes(f)||d.meaning.toLowerCase().includes(f)) : DUAS;
  list.innerHTML = filtered.map((d,i)=>`
    <div class="dua-card" onclick="toggleDua(this)">
      <div class="dua-cat">${d.cat}</div>
      <div class="dua-arabic">${d.ar}</div>
      <div class="dua-expand">
        <div class="dua-latin">${d.lat}</div>
        <div class="dua-meaning">${d.meaning}</div>
      </div>
    </div>`).join('');
}
function toggleDua(el){ el.classList.toggle('open'); }
function filterDuas(){ renderDuas(document.getElementById('dua-search').value); }

// ── WINS ──
function renderWins(){
  const wins = J('wins_'+TODAY)||[];
  // streak
  const bar = document.getElementById('streak-bar');
  bar.innerHTML = '';
  let streak = 0;
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dk = d.toISOString().slice(0,10);
    const has = (J('wins_'+dk)||[]).length > 0;
    if(has&&i>0) streak++;
    const s = document.createElement('div');
    s.className = 'streak-day'+(has?' done':'');
    bar.appendChild(s);
  }
  document.getElementById('streak-label').textContent = (wins.length>0?streak+1:streak)+' day streak';
  const list = document.getElementById('wins-list');
  list.innerHTML = wins.length ? wins.map((w,i)=>`
    <div class="win-item">
      <div class="win-star">⭐</div>
      <div class="win-text">${w}</div>
      <button class="win-del" onclick="delWin(${i})">✕</button>
    </div>`).join('') : '<div style="color:var(--text3);font-size:13px;padding:8px 0">Add your first win today →</div>';
}
function addWin(){
  const inp = document.getElementById('wins-input');
  const val = inp.value.trim();
  if(!val) return;
  const wins = J('wins_'+TODAY)||[];
  if(wins.length>=5) return;
  wins.push(val);
  W('wins_'+TODAY, wins);
  inp.value='';
  renderWins();
}
function delWin(i){
  const wins = J('wins_'+TODAY)||[];
  wins.splice(i,1);
  W('wins_'+TODAY,wins);
  renderWins();
}

// ── PRAYER TIMES (Bern approximate) ──
function getPrayerTimes(){
  const now = new Date();
  const mo = now.getMonth();
  // rough Bern times by season (month index)
  const times = [
    {n:'Fajr',   h:[5,5,5,4,4,3,3,4,4,5,5,6][mo], m:[45,30,0,30,0,30,30,0,0,0,30,15]},
    {n:'Sunrise',h:[7,7,7,6,6,5,5,6,6,7,7,8][mo], m:[30,15,45,15,0,30,30,0,30,0,30,0]},
    {n:'Dhuhr',  h:[12,12,12,13,13,13,13,13,13,12,12,12],m:[30,30,30,0,0,30,30,0,0,30,30,30]},
    {n:'Asr',    h:[15,16,16,16,17,17,17,17,16,16,15,14],m:[15,0,30,30,0,30,30,0,30,0,30,45]},
    {n:'Maghrib',h:[17,17,18,20,21,21,21,20,19,18,17,16],m:[0,45,30,30,0,30,15,30,0,0,0,45]},
    {n:'Isha',   h:[18,19,20,22,22,23,23,22,21,20,18,17],m:[30,30,30,0,30,0,0,0,30,0,30,30]},
  ];
  const nowMins = now.getHours()*60+now.getMinutes();
  let nextIdx = -1;
  const result = times.map((t,i)=>{
    const mins = t.h[mo]*60+t.m[mo];
    if(nextIdx===-1 && mins>nowMins) nextIdx=i;
    return {name:t.n, h:t.h[mo], m:t.m[mo], mins};
  });
  if(nextIdx===-1) nextIdx=0;
  return {times:result, nextIdx};
}
function renderPrayer(){
  const {times, nextIdx} = getPrayerTimes();
  const list = document.getElementById('prayer-list');
  list.innerHTML = times.map((t,i)=>`
    <div class="prayer-row${i===nextIdx?' next':''}">
      <div class="prayer-name">${t.name}</div>
      <div class="prayer-time">${String(t.h).padStart(2,'0')}:${String(t.m).padStart(2,'0')}</div>
    </div>`).join('');
  const next = times[nextIdx];
  document.getElementById('next-prayer-pill').textContent = next.name+' '+String(next.h).padStart(2,'0')+':'+String(next.m).padStart(2,'0');
}

// ── REFLECT (Premium) ──
const PREMIUM = S('premium')==='1';
const GROQ_KEY = 'GROQ_KEY_PLACEHOLDER';

async function doReflect(){
  if(S('premium')!=='1'){ showPaywall(); return; }
  const text = document.getElementById('reflect-input').value.trim();
  if(!text) return;
  const btn = document.getElementById('reflect-btn');
  btn.disabled=true;
  const res = document.getElementById('reflect-result');
  res.innerHTML='<div class="ai-response"><span class="typing-dot"></span><span class="typing-dot"></span><span class="typing-dot"></span></div>';
  try{
    const r = await fetch('https://api.groq.com/openai/v1/chat/completions',{
      method:'POST',
      headers:{'Authorization':'Bearer '+GROQ_KEY,'Content-Type':'application/json'},
      body:JSON.stringify({
        model:'llama-3.3-70b-versatile',
        max_tokens:300,
        messages:[
          {role:'system',content:'You are a gentle Islamic reflection companion. Given a user\'s day, reply in 2-3 warm sentences of reflection, then on a new paragraph write one short relevant Quran ayah in Arabic followed by its reference in brackets like [Al-Inshirah 94:5]. Keep it concise.'},
          {role:'user',content:text}
        ]
      })
    });
    const data = await r.json();
    const reply = data.choices?.[0]?.message?.content||'Could not reach server.';
    const parts = reply.split('\n\n');
    const reflection = parts.slice(0,-1).join('\n\n');
    const ayah = parts[parts.length-1];
    res.innerHTML=`<div class="ai-response"><div class="ai-response-text">${reflection}</div><div class="ai-ayah">${ayah}</div></div>`;
    W('reflect_'+TODAY, {text, reply});
  }catch(e){
    res.innerHTML='<div class="ai-response"><div class="ai-response-text" style="color:var(--text3)">Connection error. Try again.</div></div>';
  }
  btn.disabled=false;
}

// ── PAYWALL ──
const PRODUCT_ID = 'ch.architectdna.noor.reflection';

function showPaywall(){ document.getElementById('paywall').classList.add('show'); }
function closePaywall(){ document.getElementById('paywall').classList.remove('show'); }

async function unlockPremium(){
  const btn = document.getElementById('pw-buy-btn');
  btn.textContent = 'Processing…';
  btn.disabled = true;
  try {
    // StoreKit via Capacitor (available on device, not browser)
    if(window.Capacitor?.isNativePlatform()){
      const { InAppPurchase2 } = await import('./plugins/iap.js').catch(()=>({}));
      // Fallback: use window plugin if registered
      const iap = window.CdvPurchase || window.store;
      if(iap){
        iap.order(PRODUCT_ID);
        iap.when(PRODUCT_ID).approved(p=>{ p.finish(); W('premium','1'); closePaywall(); });
        return;
      }
    }
    // Browser / TestFlight simulation
    W('premium','1');
    closePaywall();
    document.getElementById('reflect-btn').textContent = 'Get Reflection ✦';
  } catch(e){
    btn.textContent = 'Unlock — $4.99';
    btn.disabled = false;
  }
}

async function restorePurchase(){
  if(window.Capacitor?.isNativePlatform()){
    const iap = window.CdvPurchase || window.store;
    if(iap){ iap.refresh(); return; }
  }
  // Simulate restore in browser
  if(S('premium')==='1'){ closePaywall(); }
  else alert('No purchase found.');
}

function switchTab(name, btn){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+name).classList.add('active');
  btn.classList.add('active');
  if(name==='wins') renderWins();
}
